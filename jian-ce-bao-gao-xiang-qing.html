<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>检测报告详情</title>
    <style>
      :root {
        --bg: #edf1f5;
        --card: #ffffff;
        --ink: #1d2833;
        --muted: #68778a;
        --line: #e2e8ef;
        --label-bg: #fafbfc;
        --blue-1: #2f6fb3;
        --blue-2: #1d4e82;
        --shadow: 0 10px 28px rgba(29, 62, 99, 0.10);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f151c;
          --card: #1a232e;
          --ink: #e9eff5;
          --muted: #9cabb9;
          --line: #2b3745;
          --label-bg: #151e28;
          --shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 20px 16px 48px;
      }

      .report-head {
        background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
        color: #fff;
        text-align: center;
        border-radius: 18px;
        padding: 30px 20px 26px;
        box-shadow: var(--shadow);
      }
      .report-head h1 {
        margin: 0;
        font-size: 27px;
        font-weight: 700;
        letter-spacing: 0.14em;
      }
      .report-head p {
        margin: 10px 0 0;
        font-size: 14.5px;
        color: rgba(255, 255, 255, 0.88);
        letter-spacing: 0.06em;
      }

      .report-card {
        background: var(--card);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: var(--shadow);
        margin-top: 16px;
      }
      .row {
        display: grid;
        grid-template-columns: 31% minmax(0, 1fr);
        border-bottom: 1px solid var(--line);
      }
      .row:last-child { border-bottom: none; }
      .label-cell {
        background: var(--label-bg);
        padding: 17px 16px;
        display: flex;
        align-items: center;
        font-size: 15.5px;
        line-height: 1.45;
        color: var(--muted);
      }
      .value-cell {
        padding: 17px 16px;
        display: flex;
        align-items: center;
        min-width: 0;
        font-size: 16.5px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
      .value-cell.empty { color: var(--muted); }

      @media (max-width: 560px) {
        .wrap { padding: 14px 12px 40px; }
        .report-head { padding: 24px 14px 21px; border-radius: 14px; }
        .report-head h1 { font-size: 23px; }
        .row { grid-template-columns: 33% minmax(0, 1fr); }
        .label-cell { padding: 15px 10px 15px 14px; font-size: 14px; }
        .value-cell { padding: 15px 12px; font-size: 15px; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header class="report-head">
        <h1>检测报告详情</h1>
        <p>扫码查看 · 共 13 项有内容</p>
      </header>

      <section class="report-card" aria-label="检测报告内容">
        <div class="row">
          <div class="label-cell">检测机构公司</div>
          <div class="value-cell">四川捷晨瑞达工程检测有限公司</div>
        </div>
        <div class="row">
          <div class="label-cell">工程名称</div>
          <div class="value-cell">温江健康医疗创新中心A区项目</div>
        </div>
        <div class="row">
          <div class="label-cell">委托单位</div>
          <div class="value-cell">成都隆科城乡发展集团有限公司</div>
        </div>
        <div class="row">
          <div class="label-cell">报告编号</div>
          <div class="value-cell">J-BG-2026032120</div>
        </div>
        <div class="row">
          <div class="label-cell">报告日期</div>
          <div class="value-cell">2026年08月25日</div>
        </div>
        <div class="row">
          <div class="label-cell">检测结果</div>
          <div class="value-cell">合格</div>
        </div>
        <div class="row">
          <div class="label-cell">资质类别</div>
          <div class="value-cell empty">—</div>
        </div>
        <div class="row">
          <div class="label-cell">见证人</div>
          <div class="value-cell">舒一峰</div>
        </div>
        <div class="row">
          <div class="label-cell">送样人</div>
          <div class="value-cell">钟世宝</div>
        </div>
        <div class="row">
          <div class="label-cell">工程监督号</div>
          <div class="value-cell">2023087/033</div>
        </div>
        <div class="row">
          <div class="label-cell">工程地址</div>
          <div class="value-cell">市辖区科兴路东段526号</div>
        </div>
        <div class="row">
          <div class="label-cell">检测项目</div>
          <div class="value-cell">普通混凝土抗压试块</div>
        </div>
        <div class="row">
          <div class="label-cell">检测结论</div>
          <div class="value-cell empty">—</div>
        </div>
      </section>
    </main>
  </body>
</html>
