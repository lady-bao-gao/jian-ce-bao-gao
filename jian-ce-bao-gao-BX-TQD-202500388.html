<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>检测报告详情</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: #ffffff;
        color: #000000;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 16px 16px 48px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        border: 1px solid #dcdcdc;
      }
      th, td {
        border: 1px solid #e3e3e3;
        font-size: 17px;
        line-height: 1.5;
        padding: 16px 12px;
        vertical-align: middle;
      }
      .title-cell {
        text-align: center;
        font-size: 28px;
        font-weight: 700;
        padding: 26px 12px;
        letter-spacing: 0.06em;
      }
      .label-cell {
        width: 33%;
        text-align: right;
        white-space: nowrap;
      }
      .value-cell {
        text-align: left;
        overflow-wrap: anywhere;
      }
      @media (max-width: 560px) {
        .wrap { padding: 12px 12px 40px; }
        th, td { font-size: 16px; padding: 14px 10px; }
        .title-cell { font-size: 25px; padding: 22px 10px; }
      }
    </style>
  </head>

</html>
